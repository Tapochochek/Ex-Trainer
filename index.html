<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр к экзамену</title>
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" href="data:,">
<style>
:root{--bg:#1c1c1e;--card:#232327;--bd:#34343a;--tx:#f2f2f2;--mu:#9a9aa2;--y:#ffe135;--yt:#222;--g:#1d3d27;--gb:#3fbf6a;--r:#472024;--rb:#e5484d;--yd:#3f3b1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f6;--card:#fff;--bd:#d9d9df;--tx:#1c1c1e;--mu:#6b6b73;--g:#d7f2de;--r:#fbdcdd;--yd:#fff4b8}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:12px 16px 24px;min-height:100vh}
h1{font-size:24px;text-align:center;margin:28px 0 20px}
.top{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;margin:4px 0 14px;min-height:44px}
.x{background:none;border:0;color:var(--mu);font-size:28px;cursor:pointer;padding:4px 8px}
.card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--y);color:var(--tx);border-radius:14px;padding:18px 16px;margin-bottom:12px;font-size:18px;font-weight:600;cursor:pointer}
.card.sec{border-left-color:var(--bd)}.card.sec.on{border-left-color:var(--y)}
.card.ok{background:var(--g);border-left-color:var(--gb)}.card.bad{background:var(--r);border-left-color:var(--rb)}
.pct{background:var(--bd);border-radius:10px;padding:6px 10px;font-size:15px;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:600;cursor:pointer;background:var(--y);color:var(--yt);width:100%}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.h{background:var(--yd);color:var(--tx);border:1px solid var(--y)}
.row{display:flex;gap:12px;margin:12px 0}
.chip{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.star{background:none;border:0;font-size:26px;color:var(--mu);cursor:pointer}.star.on{color:var(--y)}
.q{margin:8px 0 16px;line-height:1.4;font-size:17px}
.opt{display:block;width:100%;text-align:center;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:18px 14px;margin-bottom:12px;font-size:16px;cursor:pointer}
.opt.ok{background:var(--g);border-color:var(--gb)}.opt.bad{background:var(--r);border-color:var(--rb)}.opt.sel{border-color:var(--y);background:var(--yd)}
.hint{background:var(--card);border:1px dashed var(--y);border-radius:12px;padding:12px;margin-bottom:12px;color:var(--mu)}
.nav{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.lnk{display:block;text-align:center;color:var(--mu);text-decoration:underline;background:none;border:0;margin:12px auto 0;font-size:17px;cursor:pointer}
.mod{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:var(--bg);border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center}
.mb h3{margin:0 0 8px}.mb p{color:var(--mu);margin:0 0 18px}
input{width:100%;padding:16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;margin-bottom:14px}
.mu{color:var(--mu)}.s{font-size:15px;margin:6px 0}
/* адаптив: телефон / планшет / ПК */
#app{min-height:100vh;min-height:100dvh}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.opt,.q,.card,.chip{overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.kb{display:none}
@media (hover:hover){.card:hover,.btn:hover{filter:brightness(1.1)}.opt:not(.ok):not(.bad):hover{border-color:var(--y)}.x:hover,.lnk:hover{color:var(--tx)}}
@media (max-width:360px){#app{padding:10px 12px 20px}.card{font-size:16px;padding:14px 12px}.btn{font-size:15px;padding:14px 10px}.row{gap:8px}.opt{padding:14px 10px;font-size:15px}.top{font-size:19px}}
@media (min-width:768px){#app{max-width:780px;padding:28px 32px 48px}h1{font-size:30px}.top{font-size:24px}.card{font-size:19px;padding:20px 20px}.q{font-size:20px;margin:14px 0 22px}.opt{font-size:17px;text-align:left;padding:17px 20px}.btn{font-size:18px}.chip{font-size:17px}}
@media (hover:hover) and (pointer:fine){.kb{display:block;text-align:center;color:var(--mu);font-size:14px;margin:6px 0 0}}
@media (max-height:480px) and (orientation:landscape){.nav{position:static}}
</style>
</head>

{"s":2,"n":34,"q":"При настройке плана подготовки бюджетов сценарий бюджетирования может быть указан:","o":["для этапа подготовки бюджетов","для группы этапов подготовки бюджетов","в модели бюджетирования","вариант 1 или 2","верны все варианты"],"a":0},
{"s":2,"n":35,"q":"Порядок выполнения задач бюджетного процесса (последовательно или параллельно) указывается:","o":["для этапа подготовки бюджетов","для группы этапов подготовки бюджетов","в модели бюджетирования","вариант 1 или 2","верны все варианты"],"a":1},
{"s":2,"n":36,"q":"Запуск этапа подготовки бюджетного процесса за указанное количество дней определяется:","o":["в элементе справочника \"Этапы подготовки бюджетов\" (в рабочих днях)","в элементе справочника \"Этапы подготовки бюджетов\" (в календарных днях)","в группе справочника \"Этапы подготовки бюджетов\" (в рабочих днях)","в группе справочника \"Этапы подготовки бюджетов\" (в календарных днях)","вариант 1 или 2 (в каких днях — это определяется настройкой элемента справочника)","вариант 3 или 4 (в каких днях — это определяется настройкой группы справочника)"],"a":5},
{"s":2,"n":37,"q":"Переход к следующему этапу подготовки бюджетного процесса производится:","o":["в соответствии с указанной датой начала этапа","только после выполнения предшествующего этапа (по плану подготовки бюджетов)","вариант 1 или 2 в зависимости от настройки этапа","вариант 1 или 2 в зависимости от настройки модели бюджетирования"],"a":1},
{"s":2,"n":38,"q":"При заполнении экземпляра бюджета можно:","o":["вводить значения по статье бюджета для каждого из зафиксированных значений аналитик","вводить значения по статье бюджета со значением аналитики, добавленной при вводе данных (не входящей в перечень зафиксированных в бюджете значений аналитик)","вводить значения по статье бюджета с пустым значением аналитики","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":5},
{"s":2,"n":39,"q":"При заполнении экземпляра бюджета можно:","o":["вводить значения по статье бюджета для каждого из зафиксированных значений аналитик","вводить значения по статье бюджета со значением аналитики, добавленной при вводе данных (не входящей в перечень зафиксированных в бюджете значений аналитик)","вводить значения по статье бюджета со значением аналитики \"Прочее\"","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":5},
{"s":2,"n":40,"q":"Этапу подготовки бюджетного процесса можно назначить действие:","o":["\"Установка значений нефинансового показателя\"","\"Установка лимитов расхода ДС\"","\"Прочее\"","вариант 1 или 2","вариант 1 или 3","вариант 1 или 2 или 3"],"a":4},
{"s":2,"n":41,"q":"Этапу подготовки бюджетного процесса можно назначить действие:","o":["\"Ввод плана\"","\"Утверждение бюджетов\"","\"Выполнить проверку сходимости планов\"","вариант 1 или 2","вариант 2 или 3","вариант 1 или 2 или 3"],"a":3},
{"s":2,"n":42,"q":"Значение нефинансового показателя действует:","o":["пока не установлено новое","в течение текущего периода, на другой период должно быть установлено явно (под периодом понимается период, указанный в модели бюджетирования)","в течение текущего периода, на другой период должно быть установлено явно (периодичность устанавливается в настройке нефинансового показателя)","вариант 1 или 2 (определяется настройкой нефинансового показателя)","вариант 1 или 3 (определяется настройкой нефинансового показателя)"],"a":4},
{"s":2,"n":43,"q":"Значения нефинансового показателя:","o":["устанавливаются документом","получаются из системы с помощью настроенной схемы компоновки данных","вариант 1 или 2 (определяется настройкой нефинансового показателя)","вариант 1 или 2 (определяется сценарием бюджетирования)","вариант 1 или 2 (определяется моделью бюджетирования)"],"a":2},
{"s":2,"n":44,"q":"При отсутствии полного доступа к необходимым данным для их ввода в экземпляр бюджета:","o":["загружаются только те данные, по которым есть права доступа","загрузка данных не производится","вариант 1 или 2 в зависимости от настройки вида бюджетов","вариант 1 или 2 в зависимости от настройки модели бюджетирования"],"a":2},
{"s":2,"n":45,"q":"Значение производного показателя в экземпляре бюджета можно получать:","o":["с учетом данных текущего документа","без учета данных текущего документа","вариант 1 или 2 в зависимости от настройки производного показателя","вариант 1 или 2 в зависимости от настройки операнда производного показателя","вариант 1 или 2 в зависимости от настройки вида бюджета"],"a":3},
{"s":2,"n":46,"q":"Анализ данных бюджетирования в бюджетном отчете выполняется (дата актуальности):","o":["на текущую дату","на произвольную дату (в определенном диапазоне)","на дату окончания периода анализа данных","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":3},
{"s":2,"n":47,"q":"Анализ данных бюджетирования при помощи бюджетных отчетов можно выполнить:","o":["на дату актуальности","сравнением по двум датам актуальности","сравнением на текущую дату и двум датам актуальности","вариант 1 или 2","верны все варианты"],"a":3},
{"s":3,"n":1,"q":"Проведение заказа клиента в статусе \"К выполнению\" (использование заказа \"Заказ со склада и под заказ\") означает:","o":["наше намерение продать указанную в заказе номенклатуру","формирование потребностей по обеспечению заказа","возникновение планируемой задолженности клиента","варианты 1 и 2","варианты 2 и 3","верны все варианты"],"a":5},
{"s":3,"n":2,"q":"Проведение заказа клиента в статусе \"К выполнению\" (использование заказа \"Заказ как счет\") означает:","o":["намерения клиента купить указанную в заказе номенклатуру","формирование потребностей по обеспечению заказа","возникновение планируемой задолженности клиента","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":0},
{"s":3,"n":3,"q":"Товар, указанный в заказе клиента, может:","o":["быть зарезервирован на складе","закупаться обособленно (с указанием данного заказа клиента)","размещен в заказах на производство","варианты 1 и 2","варианты 2 и 3","верны все варианты"],"a":5},

{"s":3,"n":5,"q":"При создании заказа (поставщику/клиента) подобрать контрагента можно:","o":["по первым буквам наименования","по первым цифрам ИНН","по последним цифрам ИНН","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":3},
{"s":3,"n":6,"q":"При создании заказа (поставщику/клиента) подобрать партнера можно:","o":["по первым буквам наименования","по первым цифрам ИНН","по последним цифрам ИНН","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":3},
{"s":3,"n":7,"q":"При создании заказа (поставщику/клиента) без использования договоров, но при использовании соглашений, валюта документа:","o":["валюта в документе не устанавливается, используется валюта управленческого учета","может отличаться от валюты соглашения","валюта в документе не устанавливается, а берется из соглашения","обязательно должна совпадать с валютой соглашения"],"a":1},
{"s":3,"n":8,"q":"Заказ поставщику может быть записан в систему:","o":["без указания склада","с указанием склада","с указанием группы складов","вариант 1 или 2","вариант 2 или 3","верны все варианты"],"a":5},
{"s":3,"n":9,"q":"Заказ клиента (использование заказов \"Заказ как счет\") может быть проведен:","o":["без указания склада","с указанием склада","с указанием группы складов","вариант 1 или 2","вариант 2 или 3","верны все варианты"],"a":5},
{"s":3,"n":10,"q":"При указании в заказе поставщику группы складов:","o":["детализация по складам выполняется в документе поступления","детализация по складам выполняется в строках табличной части документа заказа","вариант 1 или 2","нет возможности оформить заказ поставщику на группу складов"],"a":1},
{"s":3,"n":11,"q":"При указании в заказе клиента группы складов:","o":["детализация по складам выполняется в документе отгрузки","детализация по складам выполняется в строках табличной части документа заказа","вариант 1 или 2","нет возможности оформить заказ клиента на группу складов"],"a":1},
{"s":3,"n":12,"q":"Если планируемые к поступлению товары будут поставляться в возвратной таре, то:","o":["возвратная тара указывается в табличной части \"Возвратная тара\" заказа поставщику","возвратная тара подбирается в табличную часть \"Возвратная тара\" заказа поставщику автоматически при выполнении специальной команды документа","возвратная тара указывается в табличной части \"Товары\" заказа поставщику вручную","возвратная тара подбирается в табличную часть \"Товары\" заказа поставщику при выполнении специальной команды документа","вариант 1 или 2","вариант 3 или 4"],"a":5},
{"s":3,"n":13,"q":"Оформить заказ на перемещение можно по номенклатуре с детализацией:","o":["по характеристике номенклатуры","с указанием серии номенклатуры","варианты 1 и 2"],"a":2},
{"s":3,"n":14,"q":"Если по номенклатуре ведется учет по характеристикам, то при заполнении заказа поставщику:","o":["характеристика номенклатуры должна быть указана в обязательном порядке","характеристика номенклатуры может не указываться (уточняется при поступлении)","вариант 1 или 2 в зависимости от настроек соглашения с поставщиком","вариант 1 или 2 в зависимости от прав пользователя","варианты 3 и 4","в заказе поставщику характеристики номенклатуры не указываются"],"a":0},
{"s":3,"n":15,"q":"Оформить заказ клиента можно по номенклатуре с детализацией:","o":["по характеристике номенклатуры","с указанием серии номенклатуры","только со справочным указанием серии (при использовании указанного типа политики учета по сериям)","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":3},
{"s":3,"n":16,"q":"При оформлении заказа поставщику порядок оплаты (этапы оплаты):","o":["заполняются из выбранного в документе соглашения","могут быть определены вручную","могут быть загружены из предыдущих заказов поставщику","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":5},
{"s":3,"n":17,"q":"Если при оформлении заказа поставщику не определен порядок оплаты (не заданы этапы оплаты в документе, но график оплаты определен в соглашении, выбранном в документе), то:","o":["будет использоваться порядок оплаты, указанный для пользователя \"По умолчанию\"","при проведении документа график заполнится по соглашению","документ не будет проводиться (система потребует заполнения этапов оплаты)","документ проведется, при этом считается, что оплата должна произойти в соответствии со значением реквизита документа \"Дата оплаты\" в размере 100%","система автоматически создаст этап оплаты \"Кредит 100% (после поступления)\""],"a":1},
{"s":3,"n":18,"q":"Если при оформлении заказа поставщику не определен порядок оплаты (не заданы этапы оплаты в документе, и в выбранном в документе соглашении не определен график оплаты), то:","o":["документ не будет проводиться (система потребует заполнения этапов оплаты)","документ проведется, при этом считается, что оплата должна произойти в соответствии со значением реквизита документа \"Дата оплаты\" в размере 100%","система автоматически создаст этап оплаты \"От даты заказа (оплата независимо от отгрузки) 100%\"","будет использоваться порядок оплаты, указанный для пользователя \"По умолчанию\"","вариант 2 или 4"],"a":2},
{"s":3,"n":19,"q":"Если при оформлении заказа клиента не определен порядок оплаты (не заданы этапы оплаты в документе, и в выбранном в документе соглашении не определен график оплаты), то:","o":["будет использоваться порядок оплаты, указанный для пользователя \"По умолчанию\"","документ не будет проводиться (система потребует заполнения этапов оплаты)","система автоматически создаст этап оплаты \"От даты заказа (оплата до отгрузки) 100%\"","система автоматически создаст этап оплаты \"От даты заказа (оплата независимо от отгрузки) 100%\""],"a":3},
{"s":3,"n":20,"q":"При оформлении заказа клиента могут быть указаны следующие варианты формы оплаты:","o":["наличная","безналичная","любая","вариант 1 или 2","верны все варианты"],"a":4},
{"s":3,"n":21,"q":"Если при оформлении заказа поставщику в документе указана форма оплаты (например, безналичная), то:","o":["система будет контролировать выбранный способ оплаты и не даст отразить ее в системе (до уточнения формы оплаты в заказе)","система позволит оформить оплату в наличной форме","оформление оплаты в наличной форме возможно только после завершения процесса согласования изменения формы оплаты","вариант 1 или 3"],"a":1},
{"s":3,"n":22,"q":"Заказы поставщикам могут быть сформированы с использованием специальной обработки по:","o":["плану продаж","плану продаж по категориям","плану закупок","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":2},
{"s":3,"n":23,"q":"Заказы поставщикам могут быть сформированы с использованием специальной обработки по:","o":["планам продаж","планам производства (по материалам)","планам сборки (разборки) (по комплектующим)","варианты 2 и 3","варианты 1 и 2 и 3","нет правильного ответа"],"a":5},
{"s":3,"n":24,"q":"Заказы поставщикам могут быть сформированы с использованием специальной обработки по:","o":["потребностям, сформированным заказами клиентов","потребностям, сформированным заказами на производство","потребностям, сформированным заказами на внутреннее потребление","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":5},
{"s":3,"n":25,"q":"Заказы поставщикам могут быть сформированы с использованием специальной обработки по:","o":["потребностям, сформированным заказами клиентов","потребностям, сформированным выбранной методикой поддержания складских остатков","потребностям, сформированным заказами на сборку (разборку)","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":5},
{"s":3,"n":26,"q":"Для работы обработки, позволяющей оформлять заказы поставщикам по фактическим потребностям, необходимо в систему предварительно внести информацию:","o":["об основном поставщике номенклатуры","о ценах поступления от основного поставщика","о номенклатуре поставщика","варианты 1 и 2","варианты 1 и 2 и 3","вышеуказанные действия не обязательны"],"a":5},

{"s":4,"n":3,"q":"Метод обеспечения \"Поддержание запаса (min-max)\" (при нулевых значениях min и max) заключается в следующем:","o":["формируемый заказ к поступлению обеспечивает заказы к отгрузке. Точка заказа определяется сроком исполнения заказа. К заказу подлежит количество, указанное в заказах на отгрузку","формируемый заказ к поступлению обеспечивает заказы к отгрузке. Точка заказа определяется сроком исполнения заказа. К заказу подлежит количество, указанное в заказах на отгрузку за минусом существующего остатка","формируемый заказ к поступлению обеспечивает заказы к отгрузке. Точка заказа определяется сроком исполнения заказа (в случае кредита) или сроком первого платежа (в случае предоплаты). К заказу подлежит количество, указанное в заказах на отгрузку","формируемый заказ к поступлению обеспечивает заказы к отгрузке. Точка заказа определяется сроком исполнения заказа (в случае кредита) или сроком первого платежа (в случае предоплаты). К заказу подлежит количество, указанное в заказах на отгрузку за минусом существующего остатка","вариант 1 или 2 в зависимости от настройки параметров метода обеспечения","вариант 3 или 4 в зависимости от настройки параметров метода обеспечения"],"a":4},
{"s":4,"n":4,"q":"Метод обеспечения \"Поддержание запаса (min-max)\" заключается в следующем:","o":["при снижении запаса товара до минимального количества + страховой запас — заказывается разница между максимальным и минимальным количеством","при снижении запаса товара до минимального количества + страховой запас — заказывается максимальное количество","при снижении запаса товара до минимального количества - страховой запас — заказывается максимальное количество","при снижении запаса товара до минимального количества заказывается разница между максимальным и минимальным количеством","при снижении запаса товара до минимального количества заказывается максимальное количество"],"a":4},
{"s":4,"n":5,"q":"Метод обеспечения \"Поддержание запаса (расчет по норме)\" заключается в следующем:","o":["при снижении запаса на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по заданной норме потребления в день","при снижении запаса (остаток + страховой запас) на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по заданной норме потребления в день","при снижении запаса (остаток - страховой запас) на срок исполнения заказа, заказывается количество на обеспечиваемый период. Расчет расхода товара производится по заданной норме потребления в день","при снижении запаса (остаток - страховой запас) на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по норме потребления в день, рассчитываемой системой","при снижении запаса на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по норме потребления в день, рассчитываемой системой","при снижении запаса (остаток + страховой запас) на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по норме потребления в день, рассчитываемой системой"],"a":2},
{"s":4,"n":6,"q":"Метод обеспечения \"Поддержание запаса (расчет по статистике)\" заключается в следующем:","o":["при снижении запаса на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по заданной норме потребления в день","при снижении запаса на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по норме потребления в день, рассчитываемой системой","при снижении запаса (остаток - страховой запас) на срок исполнения заказа, заказывается количество на обеспечиваемый период. Расчет расхода товара производится по заданной норме потребления в день","при снижении запаса (остаток - страховой запас) на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по норме потребления в день, рассчитываемой системой","при снижении запаса (остаток + страховой запас) на срок исполнения заказа заказывается количество на обеспечиваемый период. Расчет расхода товара производится по норме потребления в день, рассчитываемой системой"],"a":3},

{"s":6,"n":20,"q":"Как система разделяет продажу собственного товара и товара, принятого на комиссию?","o":["По умолчанию действует стратегия: \"Сначала принятый на комиссию, потом собственный\", впоследствии пользователь может изменить принадлежность товара","Стратегия списания определяется настройкой системы, но может быть откорректирована пользователем в конкретном документе отгрузки","По умолчанию действует стратегия: \"Сначала собственный, потом принятый на комиссию\", впоследствии пользователь может изменить принадлежность товара","Признак \"Собственный\" или \"Принятый\" указывается в табличной части \"Товары\" документа \"Реализация товаров и услуг\"","Стратегия списания определяется настройкой системы и корректировке в документе не подлежит"],"a":2},

{"s":9,"n":1,"q":"Изменять ресурсную спецификацию можно только в том случае, если у нее установлен статус:","o":["\"В разработке\"","\"Действует\"","при установленном статусе \"Действует\", только если у пользователя установлено право \"Изменять действующие ресурсные спецификации\"","только если эта спецификация не выбиралась ни в одном документе системы","вариант 1 или 3"],"a":0},
{"s":9,"n":2,"q":"Изменить статус ресурсной спецификации (с \"Действует\" на \"В разработке\") можно:","o":["если она не использовалась в документах заказов и выпуска","если она не использовалась в документах заказов (со статусом \"К производству\") и документах выпуска","если она не используется в документах заказов, находящихся в текущей обработке","в любом случае"],"a":3},

{"s":9,"n":5,"q":"При построении графика производства используется время загрузки вида рабочего центра, указанное в:","o":["ресурсной спецификации","этапе ресурсной спецификации","типовом технологическом процессе","операции технологического процесса","вариант 1 или 3","вариант 2 или 4"],"a":1},
{"s":9,"n":6,"q":"При построении расписания производства используется время загрузки вида рабочего центра, указанное в:","o":["ресурсной спецификации","этапе ресурсной спецификации","группе технологических операций","операции","вариант 1 или 3","вариант 2 или 4"],"a":3},

{"s":9,"n":8,"q":"Если определенный этап производства продукции выполняется силами переработчика, то в спецификации это определяется:","o":["в виде операции","как отдельный этап производства в многоэтапной ресурсной спецификации","как отдельная ресурсная спецификация (с одним этапом)","вариант 1 или 2","вариант 2 или 3","вариант 1 или 2 или 3"],"a":4},
{"s":9,"n":9,"q":"Под производственным этапом (партией) понимается:","o":["контрольная точка в производственном процессе, не обязательно связанная с получением (при выполнении всех технологических операций этапа) материального выпуска или работы","набор технологических операций (в соответствии с технологией выпуска), связанных с получением после их исполнения материального выпуска","набор технологических операций (в соответствии с технологией выпуска), связанных с получением после их исполнения нематериального выпуска (работы)","вариант 2 или 3"],"a":0},
{"s":9,"n":10,"q":"Выберите правильное утверждение:","o":["ресурсная спецификация всегда строго повторяет описание структуры продукции, заданное конструктором","ресурсная спецификация создается на технологический передел, завершающийся материальным выпуском (или выполненной работой)","ресурсная спецификация создается под каждую контрольную точку производственного процесса, не обязательно связанную с получением в конце материального выпуска или работы"],"a":1},
{"s":9,"n":11,"q":"Под полуфабрикатом в системе понимается позиция номенклатуры:","o":["с типом номенклатуры \"Полуфабрикат\"","с видом номенклатуры \"Полуфабрикат\"","находящейся в предопределенной группе \"Полуфабрикаты\" справочника \"Номенклатура\"","особым образом полуфабрикаты в системе не обосабливаются"],"a":3},
{"s":9,"n":12,"q":"Для того, чтобы свойство характеристики продукции по ресурсной спецификации транслировалось в свойство характеристики материала, необходимо:","o":["определить состав реквизитов характеристики в продукции, при определении состава реквизитов материала создать характеристику \"По шаблону\"","при определении реквизита взять его из другого вида номенклатуры","определить для характеристики продукции и материала реквизиты с одинаковым типом","определить для характеристики продукции и материала реквизиты с одинаковым наименованием и типом","вариант 1 или 2","верны все варианты"],"a":1},
{"s":9,"n":13,"q":"Для того чтобы свойство характеристики продукции по ресурсной спецификации транслировалось в используемый материал, необходимо:","o":["определить реквизит для характеристики \"По шаблону\" (тип \"Номенклатура\")","определить общий реквизит для характеристики (тип \"Номенклатура\")","определить \"локальный\" реквизит для характеристики (тип \"Номенклатура\")","вариант 1 или 2","верны все варианты"],"a":2},
{"s":9,"n":14,"q":"Получение отремонтированного изделия (по спецификации с видом \"Ремонт\") выполняется:","o":["на последнем этапе ремонтной ресурсной спецификации (указывается на закладке \"Побочный и промежуточный выпуск\")","на любом этапе ремонтной ресурсной спецификации (указывается на закладке \"Побочный и промежуточный выпуск\")","на последнем этапе ремонтной ресурсной спецификации автоматически (не требует никакой настройки)","вариант 1 или 2 в зависимости от настройки ресурсной спецификации"],"a":2},
{"s":9,"n":15,"q":"В ресурсной спецификации, при заполнении табличной части \"Трудозатраты\" перечень указанных видов работ подбирается из:","o":["справочника \"Номенклатура\" (тип номенклатуры \"Работа\")","справочника \"Номенклатура\" (тип номенклатуры \"Услуга\")","справочника \"Виды работ сотрудников\"","вариант 1 или 2"],"a":2},
{"s":9,"n":16,"q":"При настройке ресурсной спецификации с видом \"Ремонт\" \"потребление\" ремонтируемого изделия:","o":["указывается явно в рамках первого этапа ресурсной спецификации (закладка \"Материалы и работы\")","указывается явно в рамках любого этапа ресурсной спецификации (закладка \"Материалы и работы\")","происходит автоматически в рамках первого этапа ресурсной спецификации (ничего дополнительно настраивать не нужно)","вариант 1 или 2 в зависимости от настройки ресурсной спецификации","вариант 1, 2 или 3 в зависимости от настройки ресурсной спецификации"],"a":2},
{"s":9,"n":17,"q":"При настройке ресурсной спецификации количество потребляемого материала может нормироваться (определяться), в зависимости от:","o":["количества основного сырья","количества выпускаемой продукции","значения характеристики выпускаемой продукции","вариант 1 или 2","вариант 2 или 3","верны все варианты"],"a":5},
{"s":9,"n":18,"q":"При настройке ресурсной спецификации количество потребляемого материала может нормироваться (определяться) в зависимости от:","o":["количества выпускаемой продукции (используется соотношение количества производимой продукции, указанного в ресурсной спецификации, к количеству материала, указанного в табличной части \"Материалы и работы\")","по произвольной формуле (от количества выпускаемой продукции)","по произвольной формуле (в зависимости от значения характеристики выпускаемой продукции)","вариант 1 или 2","вариант 2 или 3","верны все варианты"],"a":5},
{"s":9,"n":19,"q":"При настройке ресурсной спецификации планируемое потребление материала может определяться:","o":["в зависимости от значения свойства характеристики производимой продукции","в зависимости от условий производства (задаются в заказе на производство)","в зависимости от значения свойства основного сырья","вариант 1 или 2","вариант 2 или 3","верны все варианты"],"a":5},
{"s":9,"n":20,"q":"При настройке ресурсной спецификации характеристика потребляемого материала может:","o":["задаваться в табличной части \"Материалы и работы\"","определяться характеристикой выпускаемой продукции","уточняться при производстве","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":5},
{"s":9,"n":21,"q":"Расценки на работы сотрудников (указываемых на закладке \"Трудозатраты\" ресурсной спецификации) указываются в валюте:","o":["регламентированного учета","в произвольной валюте","управленческого учета","валюте, установленной в настройках системы (\"Валюта видов работ сотрудников\")"],"a":3},
{"s":9,"n":22,"q":"Установка длительности предварительного и завершающего буферов этапов ресурсной спецификации (в случае построения графика производства с периодичностью \"Час\") может производиться в:","o":["минутах","часах","днях","вариант 1 или 2","вариант 2 или 3","вариант 1 или 2 или 3"],"a":2},
{"s":9,"n":23,"q":"Установка длительности предварительного и завершающего буферов этапов ресурсной спецификации (в случае построения графика производства с периодичностью \"День\") может производиться в:","o":["минутах","часах","днях","вариант 1 или 2","вариант 2 или 3","варианты 1 или 2 или 3"],"a":2},
{"s":9,"n":24,"q":"Если для этапа ресурсной спецификации используются технологические процессы, то при построении графика производства на занятость интервалов планирования влияет время, указываемое в:","o":["этапе ресурсной спецификации","технологическом процессе","ресурсной спецификации","регистре сведений \"Длительность производственных процессов\""],"a":0},
{"s":9,"n":25,"q":"При описании последовательности операций в рамках технологического процесса параллельные операции могут определяться:","o":["без каких-либо ограничений","нельзя определить в качестве параллельных те операции, с которых начинается исполнение части производственного процесса","нельзя определить в качестве параллельных завершающие операции","варианты 2 и 3"],"a":3},
{"s":9,"n":26,"q":"При описании последовательности этапов в рамках ресурсной спецификации параллельные этапы могут определяться:","o":["без каких-либо ограничений","нельзя определить в качестве параллельных те этапы, с которых начинается производственный процесс","нельзя определить в качестве параллельных завершающие производственный процесс этапы","варианты 2 и 3"],"a":2},
{"s":9,"n":27,"q":"При описании последовательности операций в рамках технологического процесса у завершающей операции номер следующей операции устанавливается:","o":["исходя из того, что предложила система (следующий по порядку номер)","в операции устанавливается флаг \"Последняя операция\"","значение номера устанавливается в 0","в номере следующей операции выбирается значение \"Последняя\"","исходя из того, что предложила система (значение \"Последняя операция\")"],"a":2},
{"s":9,"n":28,"q":"При описании последовательности этапов в рамках ресурсной спецификации у завершающего этапа номер следующего этапа устанавливается:","o":["в номере следующего этапа выбирается значение \"последняя\"","в форме этапа устанавливается флаг \"Последний этап\"","значение номера следующего этапа устанавливается в 0","исходя из того, что предложила система (следующий по порядку номер)","исходя из того, что предложила система (значение \"Последний этап\")"],"a":2},
{"s":9,"n":29,"q":"В случае если в производстве какого-либо изделия задействуется полуфабрикат (производимый по спецификации), то в соответствующей строке табличной части \"Материалы и работы\" ресурсной спецификации этот факт указывается:","o":["обязательным указанием ресурсной спецификации, по которой выпускается данный полуфабрикат","установкой флага в реквизите табличной части \"Произвести по спецификации\"","в ресурсной спецификации ничего не нужно делать, используется факт наличия основной спецификации у выбранной номенклатурной позиции","используется значение реквизита справочника \"Номенклатура\" \"Вид воспроизводства\"","варианты 1 и 2","варианты 1 и 4"],"a":1},
{"s":9,"n":30,"q":"В случае если в производстве какого-либо изделия задействуется полуфабрикат, при этом часть количества полуфабриката берется со склада, а остальное производится, тогда:","o":["строка табличной части \"Материалы и работы\" ресурсной спецификации определяется с указанием ресурсной спецификации, по которой производится полуфабрикат","строка табличной части \"Материалы и работы\" ресурсной спецификации определяется без указания ресурсной спецификации, по которой производится полуфабрикат","для строки табличной части \"Материалы и работы\" требуется воспользоваться возможностями команды \"Настройка потребления\"","варианты 1 и 3","варианты 2 и 3","от настройки ресурсной спецификации не зависит"],"a":5},
{"s":9,"n":31,"q":"В ресурсной спецификации на закладке \"Продукция\" в реквизите табличной части \"Доля стоимости\" указывается:","o":["процент, в соответствии с которым будут распределяться затраты по данной спецификации на данную продукцию (на единицу продукции)","процент, в соответствии с которым будут распределяться затраты по данной спецификации на данную продукцию (на указанное количество продукции)","весовой коэффициент, в соответствии с которым будут распределяться затраты по данной спецификации на данную продукцию (на единицу продукции)","весовой коэффициент, в соответствии с которым будут распределяться затраты по этой спецификации на выпускаемую продукцию (на указанное количество продукции)"],"a":3},
{"s":9,"n":32,"q":"В ресурсной спецификации на закладке \"Материалы и работы\" можно указывать статьи калькуляции с типом:","o":["\"Материальные\"","\"Амортизация\"","\"Прочее\"","вариант 1 или 2","вариант 1 или 3","вариант 1 или 2 или 3"],"a":0},
{"s":9,"n":33,"q":"В ресурсной спецификации на закладке \"Трудозатраты\" можно указывать статьи калькуляции с типом:","o":["\"Оплата труда\"","\"Амортизация\"","\"Прочее\"","вариант 1 или 2","вариант 1 или 3","вариант 1 или 2 или 3"],"a":0},
{"s":9,"n":34,"q":"В ресурсной спецификации можно указывать:","o":["номенклатурные затраты","и номенклатурные, и постатейные затраты","постатейные затраты"],"a":0},
{"s":9,"n":35,"q":"Выберите правильное утверждение: \"Если для этапа производства установить значение реквизита \"Длительность этапа\", это означает, что:","o":["производственный процесс по этапу выполняется за указанный период (при необходимости запланировать два таких этапа занятое время увеличивается вдвое и т. п.)","производственный процесс занимает указанный период времени (для любого количества таких этапов)","производственный процесс по данному этапу укладывается в указанный период (при этом параллельно могут планироваться другие подобные этапы)"],"a":2},
{"s":9,"n":36,"q":"В случае, когда реквизит \"Длительность этапа\" у производственного этапа установлен в значение \"1 день\", это означает, что:","o":["продолжительность исполнения этапа составляет один рабочий день (по графику работы подразделения), и на это время загружаемый вид рабочих центров не сможет выполнять другие этапы производства","продолжительность исполнения этапа составляет 24 часа, и на это время загружаемый вид рабочих центров не сможет выполнять другие этапы производства","время исполнения этапа \"умещается\" в один день, при этом оценка загрузки оборудования не производится","продолжительность исполнения этапа составляет один рабочий день (по графику работы подразделения), и на это время подразделение не сможет выполнять другие этапы производства","продолжительность исполнения этапа составляет 24 часа, и на это время подразделение не сможет выполнять другие этапы производства"],"a":2},
{"s":9,"n":37,"q":"Указываемые на закладке \"Трудозатраты\" ресурсной спецификации работы:","o":["переносятся в этап производства в полном объеме","могут не переноситься в этап производства в зависимости от значения свойства характеристики продукции","могут не переноситься в этап производства в зависимости от значения свойства характеристики материала","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":5},
{"s":9,"n":38,"q":"Плановая калькуляция может составляться для:","o":["изделия","изделия, производимого по указанной ресурсной спецификации","заказов на производство","вариант 1 или 2","вариант 2 или 3","вариант 1 или 2 или 3"],"a":4},
{"s":9,"n":39,"q":"Плановая калькуляция может составляться:","o":["для одного изделия по выбранной ресурсной спецификации без возможности указания характеристики","для одного изделия по выбранной ресурсной спецификации с возможностью указания характеристики","для нескольких изделий с выбранными ресурсными спецификациями без возможности указания характеристик","для нескольких изделий с выбранными ресурсными спецификациями с возможностью указания характеристик","вариант 2 или 3","вариант 2 или 4"],"a":5},
{"s":9,"n":40,"q":"Результат выполнения производственного этапа:","o":["является продукцией или возвратным отходом по ресурсной спецификации (если этот этап последний)","является товарно-материальной ценностью или возвратным отходом по ресурсной спецификации (не только на последнем этапе)","может использоваться в следующих этапах данной ресурсной спецификации","вариант 1 или 2","верны все варианты"],"a":4},
{"s":9,"n":41,"q":"При указании в ресурсной спецификации побочного выпуска:","o":["характеристика этой номенклатуры указывается в ресурсной спецификации (не может подбираться)","характеристика этой номенклатуры может подбираться из свойства характеристики продукции","характеристику указать нельзя"],"a":1},
{"s":9,"n":42,"q":"Указываемые на закладке \"Трудозатраты\" ресурсной спецификации виды работ переносятся в этап производства:","o":["в полном объеме","в количестве, рассчитанном по формуле (в зависимости от свойства характеристики определенного материала)","в количестве, рассчитанном по формуле (в зависимости от количества определенного материала)","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":5},
{"s":9,"n":43,"q":"Расценка у вида работы на определенную дату:","o":["может быть только одной и не связанной с квалификационным разрядом","может быть только одной и связанной с определенным квалификационным разрядом","может быть установлена для каждого квалификационного разряда","расценки не используются, начисление суммы производится исходя из тарифа и количества отработанных часов"],"a":2},
{"s":9,"n":44,"q":"При определении вида работы в одноименном справочнике она:","o":["не связана с квалификационным разрядом (нет понятия \"квалификационный разряд \"по умолчанию\")","связана с определенным квалификационным разрядом (выбирается в реквизите справочника)","может быть связана с различными квалификационными разрядами (указывается в табличной части справочника)"],"a":1},
{"s":9,"n":45,"q":"В качестве исполнителей для вида работ производственных этапов используются:","o":["бригады","работники","бригады или работники","вариант 1 или 2 или 3 (определяется настройкой производственного подразделения)","вариант 1 или 2 или 3 (определяется настройкой организации)"],"a":3},
{"s":9,"n":46,"q":"При использовании методик управления производством выпуски продукции, учитываемые в мерных единицах измерения:","o":["кратны количеству, указанному на закладке \"Продукция\" ресурсной спецификации (при указании в спецификации 1 кг нельзя выпустить 1,5 кг, можно или 1 кг, или 2кг)","могут быть не кратными количеству, указанному на закладке \"Продукция\" ресурсной спецификации, но только в сторону увеличения (при указании в спецификации 1 кг, можно выпустить 1,5 кг, нельзя выпустить 0,5 кг)","могут быть не кратными количеству, указанному на закладке \"Продукция\" ресурсной спецификации, но только в сторону уменьшения (при указании в спецификации 1 кг нельзя выпустить 1,5 кг, можно выпустить 0,5 кг)","вариант 1 или 2 (в зависимости от настройки ресурсной спецификации)","вариант 1 или 3 (в зависимости от настройки ресурсной спецификации)","могут быть либо кратными, либо не кратными количеству продукции, указанному в спецификации (без ограничений \"по направлению\") в зависимости от настройки ресурсной спецификации"],"a":5},
{"s":9,"n":47,"q":"В случае, когда в этапе ресурсной спецификации (статическая структура заказа) указывается несколько загружаемых видов рабочих центров, то предполагается, что они при планировании загружаются:","o":["одновременно","последовательно","независимо","вариант 1 или 2 (в зависимости от настройки этапа ресурсной спецификации)","вариант 1 или 3 (в зависимости от настройки этапа ресурсной спецификации)","вариант 1 или 2 или 3 (в зависимости от настройки этапа ресурсной спецификации)"],"a":5},
{"s":9,"n":48,"q":"В случае, когда в этапе ресурсной спецификации (динамическая структура заказа) указывается несколько загружаемых видов рабочих центров, то предполагается, что они при планировании загружаются:","o":["одновременно","последовательно","независимо","вариант 1 или 2 (в зависимости от настройки этапа ресурсной спецификации)","вариант 1 или 3 (в зависимости от настройки этапа ресурсной спецификации)","вариант 1 или 2 или 3 (в зависимости от настройки этапа ресурсной спецификации)"],"a":0},
{"s":9,"n":49,"q":"При указании в этапе ресурсной спецификации загружаемого вида рабочего центра:","o":["указанное нормативное время загрузки используется при построении графика производства","указанное нормативное время загрузки может использоваться, а может и не использоваться при построении графика производства (как будто данный вид рабочего центра не задействуется при выполнении этапа), в зависимости от свойства характеристики основной продукции","указанное нормативное время загрузки может использоваться, а может и не использоваться при построении графика производства (как будто данный вид рабочего центра не задействуется при выполнении этапа), в зависимости от свойства характеристики любой продукции, производимой по данной ресурсной спецификации","вариант 1 или 2","вариант 1 или 3","вариант 1 или 2 или 3"],"a":3},
{"s":9,"n":50,"q":"В этапе ресурсной спецификации нормативное время загрузки вида рабочего центра:","o":["вводится в обязательном порядке, во введенном размере используется при построении графика производства","может рассчитываться в зависимости от количества или от свойств характеристик продукции","может рассчитываться в зависимости от количества или от свойств характеристик материалов","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":5},
{"s":9,"n":51,"q":"Изделие выпускается не на последнем этапе ресурсной спецификации (промежуточный выпуск). Тогда:","o":["выпуск такой продукции производится по плановой стоимости","себестоимость такой продукции рассчитывается","в момент выпуска продукция учитывается по плановой стоимости, после выполнения расчета себестоимости себестоимость приводится к фактической","вариант 1 или 3 в зависимости от использования механизма плановой себестоимости","данное действие в системе недопустимо"],"a":0},
{"s":9,"n":52,"q":"При использовании разборочной ресурсной спецификации в табличной части \"Материалы и работы\" в колонке \"Способ получения материала\" можно выбрать ресурсную спецификацию с видом:","o":["\"Разборка, утилизация\"","\"Ремонт\"","\"Изготовление, сборка\"","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":0},
{"s":9,"n":53,"q":"В случае когда количество планируемой к выпуску продукции меньше параметра ресурсной спецификации \"Минимальный запуск\":","o":["партия будет запланирована в момент, когда накопленная партия продукция превысит значение параметра \"Минимальный запуск\"","к запуску будет запланирована партия в количестве, равном значению \"Минимального запуска\"","планирование партии выпуска продукции не будет выполнено"],"a":1},

{"s":10,"n":2,"q":"Формирование расписания производства относится к функционалу:","o":["главного диспетчера","локального диспетчера","вариант 1 или 2","формирование расписания производства производится регламентным заданием и к функционалу главного и локальных диспетчеров не относится"],"a":1},

{"s":10,"n":4,"q":"При формировании графика производства:","o":["планируется, какой рабочий центр будет выполнять определенные производственные этапы","планируется, какой ключевой вид рабочего центра и в какие интервалы планирования будет выполнять определенные производственные этапы","планируется, какое подразделение будет выполнять определенные производственные этапы","планируется, какое подразделение и в какие интервалы планирования будет выполнять определенные производственные этапы","планируется, какой рабочий центр и в какие интервалы планирования будет выполнять определенные производственные этапы","планируется, какой ключевой вид рабочего центра будет выполнять определенные производственные этапы"],"a":3},
{"s":10,"n":5,"q":"Возможность формирования заказов на производство по плану производства:","o":["определяется в сценарии","определяется в подразделении","определяется в самом плане","определяется наличием вида плана","определяется в виде плана"],"a":3},
{"s":10,"n":6,"q":"При формировании расписания производства:","o":["планируется, какой рабочий центр будет выполнять определенные производственные этапы","планируется, какой рабочий центр и в какое время будет выполнять определенные производственные операции","планируется, какое подразделение и в какие интервалы планирования будет выполнять определенные производственные этапы","планируется, какое подразделение будет выполнять определенные производственные этапы","планируется, какой ключевой вид рабочего центра будет выполнять определенные производственные этапы","планируется, какой ключевой вид рабочего центра и в какие интервалы планирования будет выполнять определенные производственные этапы"],"a":1},
{"s":10,"n":7,"q":"Документы \"Этап производства\" создаются на основании:","o":["сформированного графика производства","составленного расписания производства","в ходе исполнения расписания производства","нет правильного ответа"],"a":3},
{"s":10,"n":8,"q":"Интервал планирования для оценки доступности ресурсов при составлении графика производства указывается:","o":["в виде номенклатуры","в виде рабочего центра","для рабочего центра","в параметрах производственного подразделения","в настройках системы","вариант 1 или 2"],"a":3},
{"s":10,"n":9,"q":"В случае одновременного указания графика работ в рабочем центре для вида рабочих центров, производственного подразделения при построении расписания производства используется график:","o":["вида рабочего центра (так как для рабочего центра нет возможности указать график)","производственного подразделения","рабочего центра","вида рабочих центров","производственного подразделения (так как для вида рабочего центра и самого рабочего центра нет возможности указать график)"],"a":2},
{"s":10,"n":10,"q":"Доступность вида рабочего центра (в графике производства):","o":["определяется по графикам работы рабочих центров","вводится для вида рабочего центра","вариант 1 или 2 (определяется настройкой вида рабочего центра)","вариант 1 или 2 (определяется настройкой подразделения)"],"a":2},
{"s":10,"n":11,"q":"Если вид рабочего центра может выполнить неограниченный объем работ, то данную возможность необходимо указать в настройках:","o":["рабочего центра","вида рабочих центров","подразделения","нет возможности заведения рабочих центров с неограниченной доступностью","вариант 1 или 2","вариант 1 или 2 или 3"],"a":1},
{"s":10,"n":12,"q":"При определении параметров производственного подразделения интервал планирования может быть установлен:","o":["\"Час\"","\"День\"","\"Неделя\"","\"Смена\"","вариант 2 или 3","верны все варианты"],"a":5},
{"s":10,"n":13,"q":"Для того чтобы при планировании производственных процессов в определенном производственном подразделении по определенному заказу на производство не контролировалось наличие производственных мощностей (при использовании в системе в целом методики, позволяющей контролировать наличие материальных и производственных ресурсов), необходимо:","o":["в свойствах видов рабочих центров подразделения сбросить флажок \"Планировать работу в графике производства\"","в этапе ресурсной спецификации сбросить флажок \"Планировать работу видов рабочих центров\"","для требуемых производственных этапов, выполняемых в данном подразделении, сбросить флажок \"Планировать работу видов рабочих центров\"","вариант 1 или 2","вариант 1 или 3","верны все варианты"],"a":2},
{"s":10,"n":14,"q":"В вид рабочего центра включаются рабочие центры:","o":["работающие с одинаковой производительностью","работающие параллельно","выполняющие одинаковые производственные операции","варианты 1 и 3","варианты 2 и 3"],"a":2},
{"s":10,"n":15,"q":"При использовании пооперационного уровня управления возможны варианты его использования:","o":["с указанием в операциях материалов","с указанием в операциях выходных изделий","с использованием пооперационного планирования","либо варианты 1 и 2, либо вариант 3","любая комбинация вариантов 1, 2, 3"],"a":4},
{"s":10,"n":16,"q":"В заказ на производство, формируемый по потребностям, попадают потребности:","o":["возникшие по номенклатуре, у которой в параметрах обеспечения потребностей на определенном складе выбрано значение \"Производство\"","возникшие по номенклатуре, у которой в параметрах обеспечения потребностей в определенной цеховой кладовой выбрано значение \"Производство\"","возникшие по полуфабрикату, необходимому для производства продукции, когда в этапе производства для него указано \"Производится по спецификации или на этапе\" (с указанием ресурсной спецификации)","варианты 1 и 2","варианты 1 и 3","верны все варианты"],"a":3},
{"s":10,"n":17,"q":"Реквизит \"Приоритет\" заказа на производство может принимать:","o":["3 значения","100 значений","любое количество значений","5 значений","10 значений"],"a":2},
{"s":10,"n":18,"q":"Если в проведенном заказе на производство (со статусом \"К производству\") перевыбрать ресурсную спецификацию и перепровести документ, то:","o":["если по заказу на производство были сформированы этапы производства, то они будут помечены на удаление автоматически","никаких изменений в этапах не произойдет (для того чтобы изменения в заказе были приняты системой, старые этапы нужно пометить на удаление в ручном режиме либо воспользоваться командой по удалению этапов и после этого создать новые)","с таким статусом документ не подлежит корректировке"],"a":1},
{"s":10,"n":19,"q":"Если в проведенном заказе на производство (со статусом \"К производству\") изменить количество требуемой продукции и перепровести документ, то:","o":["если по заказу на производство были сформированы этапы производства, то они будут помечены на удаление автоматически","с таким статусом документ не подлежит корректировке","никаких изменений в этапах не произойдет (для того чтобы изменения в заказе были приняты системой, старые этапы нужно пометить на удаление в ручном режиме либо воспользоваться командой по удалению этапов и после этого создать новые)","в созданных этапах производства количество откорректируется автоматически"],"a":2},
{"s":10,"n":20,"q":"Если для выпуска продукции по определенному заказу на производство нужно определенный материал заменить на его аналог, то нужно:","o":["создать новую ресурсную спецификацию и указать ее в заказе на производство","в этапе производства на закладке \"Обеспечение материалами и работами\" удалить строку со старым материалом и добавить новую строку с новым материалом","в этапе производства на закладке \"Обеспечение материалами и работами\" выбрать аналог из ранее разрешенных к использованию материалов","в этапе производства на закладке \"Обеспечение материалами и работами\" выбрать новый материал (никаких дополнительных действий выполнять не нужно)","вариант 2 или 4"],"a":2},
{"s":10,"n":21,"q":"При заполнении документа \"Заказ на производство\" в шапке документа указывается подразделение:","o":["в котором будет производиться выпуск продукции","сформировавшее потребность в производстве","подразделение-диспетчер","варианты 1 и 2","варианты 1 и 3","варианты 1 и 2 и 3"],"a":2},
{"s":10,"n":22,"q":"Приоритет подразделения-диспетчера в очереди заказов может быть изменен в:","o":["форме элемента справочника подразделения-диспетчера","форме списка \"Настройка приоритетов подразделений-диспетчеров\"","в периодическом регистре сведений \"Приоритеты подразделений-диспетчеров\"","вариант 1 или 3"],"a":1},
{"s":10,"n":23,"q":"В заказе на производство (динамическая структура заказа) порядок размещения выпуска в графике производства может быть:","o":["к началу","к окончанию","равномерно","вариант 1 или 2","вариант 1 или 2 или 3"],"a":0},
{"s":10,"n":24,"q":"Для того чтобы в строке формируемого этапа производства (на закладке \"Обеспечение материалами и работами\") в качестве стратегии получения материала использовалось значение \"Обеспечивать\" (значение по умолчанию), необходимо:","o":["установить для материала в способе обеспечения потребностей (в параметрах управления запасами) тип обеспечения \"Покупка\"","выполнить соответствующую настройку в строке ресурсной спецификации (на закладке \"Материалы и работы\")","настроить для материала метод обеспечения (параметры поддержания запаса)","варианты 1 и 2","варианты 1 и 2 и 3"],"a":1},
{"s":10,"n":25,"q":"Для того чтобы в строке этапа производства (на закладке \"Обеспечение материалами и работами\") в качестве стратегии получения материала использовалось значение \"Не обеспечивать\":","o":["для материала должен отсутствовать способ обеспечения потребностей","соответствующая настройка должна быть выполнена в строке ресурсной спецификации (на закладке \"Материалы и работы\")","для материала должен отсутствовать метод обеспечения (параметры поддержания запаса)","варианты 1 и 2","варианты 1 и 2 и 3","нет такой возможности"],"a":5},
{"s":10,"n":26,"q":"При использовании динамической структуры заказа потребности в материалах возникают:","o":["при проведении заказа на производство","при формировании партий производства","при формировании графика производства","при установке у этапа производства статуса \"К выполнению\"","при установке у этапа производства статуса \"Начат\""],"a":0},
{"s":10,"n":27,"q":"Если в строке этапа производства (закладка \"Обеспечение материалами и работами\") не указано, что полуфабрикат производится в процессе производства, то для того, чтобы этап прошел контроль по материальному обеспечению:","o":["данный полуфабрикат должен находиться на складе","данный полуфабрикат должен находиться в производственном подразделении","данный полуфабрикат должен находиться в цеховой кладовой","вариант 1 или 3 (зависит от значения реквизита табличной части \"Склад\")","вариант 1 или 2 или 3 (зависит от значения реквизита табличной части \"Склад\")","вариант 1 или 2 или 3 (зависит от значений реквизита табличной части \"Действия\" и \"Склад\")"],"a":3},
{"s":10,"n":28,"q":"При формировании заказа на производство для полуфабрикатов, которые требуются для обеспечения выпусков продукции, система может предложить к производству:","o":["количество, рассчитанное по ранее оформленным (и не обеспеченным по данным полуфабрикатам) заказам на производство (без учета запасов и других потребностей)","количество, рассчитанное по ранее оформленным (и не обеспеченным по данным полуфабрикатам) заказам на производство, с учетом существующего остатка полуфабрикатов на складе","количество, рассчитанное по ранее оформленным (и не обеспеченным по данным полуфабрикатам) заказам на производство, с учетом уже запланированных выпусков данных полуфабрикатов","вариант 1 или 2","вариант 2 или 3","вариант 1 или 2 или 3"],"a":4},
{"s":10,"n":29,"q":"В случае если при построении графика производства на нужный интервал планирования не хватает доступности загружаемых видов рабочих центров, то из данной ситуации можно выйти следующим образом:","o":["при построении графика производства отметить флажок \"С учетом альтернативных видов рабочих центров\" (альтернативные виды рабочих центров должны быть указаны в ресурсной спецификации)","при построении графика производства отметить флажок \"С учетом альтернативных видов рабочих центров\" (альтернативный вид рабочего центра может быть выбран вручную)","в этапе производства выбрать альтернативные виды рабочих центров (только из перечня, указанного в этапе ресурсной спецификации)","в этапе производства выбрать альтернативные виды рабочих центров (можно выбрать произвольный вид рабочего центра)","вариант 1 или 3","вариант 2 или 4"],"a":3},
{"s":10,"n":30,"q":"В рабочем месте \"Диспетчирование этапов\" можно:","o":["планировать заказ","планировать выбранные этапы/партии производства","планировать работы по устранению брака","варианты 1 и 2","варианты 1 и 2 и 3"],"a":3},
{"s":10,"n":31,"q":"Порядок следования заказов на производство в очереди заказов определяется:","o":["приоритетом заказа / временем создания заказа","приоритетом подразделения-диспетчера / временем создания заказа","приоритетом заказа / ручной установкой положения внутри приоритета","приоритетом заказа / приоритетом подразделения-диспетчера / ручной установкой положения внутри группы","приоритетом заказа / приоритетом подразделения-диспетчера / временем создания заказа","приоритетом подразделения-диспетчера / ручной установкой положения внутри приоритета подразделения-диспетчера"],"a":3},
{"s":10,"n":32,"q":"Изменить порядок следования заказов в очереди заказов на производство можно в рамках:","o":["заказов с одинаковым приоритетом и обрабатываемых определенным подразделением-диспетчером","заказов с одинаковым приоритетом","заказов, обрабатываемых определенным подразделением-диспетчером","без ограничений"],"a":0},
{"s":10,"n":33,"q":"Имитационное моделирование графика производства возможно:","o":["без контроля доступности материалов","без контроля доступности производственных мощностей","без учета резерва доступности видов рабочих центров","варианты 1 и/или 2","варианты 1 и/или 2 и/или 3"],"a":4},

{"s":10,"n":36,"q":"Построение расписания производства выполняется из рабочего места:","o":["\"Управление очередью заказов\"","\"Диспетчирование этапов\"","\"Выполнение операций (MES)\"","\"Пооперационное планирование\"","вариант 1 или 2","вариант 3 или 4"],"a":3},
{"s":10,"n":37,"q":"При построении расписания производства сценарий пооперационного планирования:","o":["определяется в общем для всех моделей пооперационного планирования (может использоваться только один)","определяется для каждой модели пооперационного планирования индивидуально (без каких-либо ограничений)","определяется для любой модели пооперационного планирования индивидуально (при необходимости, без каких-либо ограничений)","определяется для любой модели пооперационного планирования индивидуально (при необходимости, но без возможности сохранения расписания по данной модели)"],"a":3},
{"s":10,"n":38,"q":"При указании используемых производственных мощностей (в этапе ресурсной спецификации) могут использоваться:","o":["загружаемые виды рабочих центров","альтернативные виды рабочих центров","ключевой вид рабочего центра","вариант 1 или 2","вариант 1 или 2 или 3"],"a":3},
{"s":10,"n":39,"q":"При формировании графика производства данные об используемых производственных мощностях берутся из:","o":["ресурсной спецификации","этапа ресурсной спецификации","технологического процесса (операций)","вариант 1 или 3 в зависимости от использования в текущем подразделении уровня операций","вариант 2 или 3 в зависимости от использования в текущем подразделении уровня операций"],"a":1},
{"s":10,"n":40,"q":"В прикладном решении предусмотрены следующие способы ограничения действия разрешения на замену материалов:","o":["по заказу на производство","по заказу клиента","по подразделению","верны варианты 1 и 2","верны варианты 1 и 3","верны варианты 1 и 2 и 3"],"a":4},
{"s":10,"n":41,"q":"В прикладном решении предусмотрены следующие способы ограничения действия разрешения на замену материалов:","o":["по продукции","по ресурсной спецификации","по виду рабочего центра","вариант 1 или 2","вариант 1 или 3","вариант 1 или 2 или 3"],"a":3},
{"s":10,"n":42,"q":"Перепланирование графика производства выполняется для этапов, у которых:","o":["для этапов производства установлен статус \"Сформирован\"","для этапов производства установлен статус \"К выполнению\"","для этапов производства установлен статус \"Начат\"","вариант 1 или 2","вариант 1 или 2 или 3"],"a":3},
{"s":10,"n":43,"q":"После формирования этапов производства (статус \"Сформирован\") с ними можно работать в рабочем месте:","o":["\"Диспетчирование этапов\"","\"Выполнение этапов\"","\"Выполнение операций\"","вариант 1 или 2","вариант 1 или 2 или 3"],"a":0},
{"s":10,"n":44,"q":"Построение расписания производства невозможно, если в производственном подразделении:","o":["не используется уровень операций","используются сменные задания","используется пооперационное планирование","вариант 1 или 2","вариант 1 или 3","вариант 1 или 2 или 3"],"a":3},
{"s":10,"n":45,"q":"При построении расписания производства возможно его построение:","o":["только по одной модели пооперационного планирования","по нескольким моделям пооперационного планирования (все модели считаются рабочими)","по нескольким моделям пооперационного планирования (рабочей является только одна из них)","при использовании моделей пооперационного планирования полученное расписание использовать в качестве рабочего нельзя"],"a":2},
{"s":10,"n":46,"q":"Расписание производства строится автоматически (по заложенным математическим алгоритмам), если в производственном подразделении:","o":["не используется уровень операций","используются сменные задания","используется пооперационное планирование","вариант 1 или 2","вариант 1 или 3","варианты 1 и 2 и 3"],"a":2},
{"s":10,"n":47,"q":"При использовании статической структуры заказа, методика, используемая для управления производственными процессами (без планирования графика производства, планирование по материальным ресурсам, планирование по материальным и производственным ресурсам), указывается","o":["в параметрах подразделения-диспетчера","в заказе на производство","в параметрах производственного подразделения","в настройках системы"],"a":3},
{"s":10,"n":48,"q":"При планировании производственного процесса на каждый этап, определенный в ресурсной спецификации, создается:","o":["\"Технологический процесс\"","\"Этап производства\"","\"Операция\"","вариант 1 или 2 (в зависимости от настройки производственного подразделения)","вариант 1 или 3 (в зависимости от настройки подразделения-диспетчера)"],"a":1},
{"s":10,"n":49,"q":"В заказе на производство:","o":["необходимо указать ресурсную спецификацию","ресурсную спецификацию можно не указывать","ресурсную спецификацию можно не указывать (но только если статус заказа на производство — \"Сформирован\")","в заказе на производство нет возможности указать ресурсную спецификацию"],"a":1},
{"s":10,"n":50,"q":"Потребляемые в процессе производства материалы указываются:","o":["в заказе на производство","в этапе производства","в операции","варианты 1 и 2","варианты 2 и 3 (в зависимости от настройки)","варианты 1 и 2 и 3 (в зависимости от настройки)"],"a":4},
{"s":10,"n":51,"q":"При использовании методики управления производственными процессами \"Без планирования графика производства\":","o":["формируется последовательность этапов","контролируется наличие производственных мощностей","строится расписание производства","варианты 1 и 2","варианты 1 и 3","варианты 1 и 2 и 3"],"a":0},
{"s":10,"n":52,"q":"При использовании методики управления производственными процессами \"Планирование по материальным и производственным ресурсам\" этап может быть размещен:","o":["по общей длительности","по доступности ВРЦ","вручную","вариант 1 или 2","вариант 1 или 3","вариант 1 или 2 или 3"],"a":5},
{"s":10,"n":53,"q":"При использовании методики \"Планирование по материальным и производственным ресурсам\" использование уровня операций определяется:","o":["в заказе на производство","в параметрах подразделения-диспетчера","в параметрах производственного подразделения","в настройках системы"],"a":2},
{"s":10,"n":54,"q":"При использовании документа \"Производство без заказа\" необходимо по продукции, имеющей материально-вещественное воплощение:","o":["первоначально отразить выпуск продукции, а потом передать ее на склад","первоначально передать продукцию на склад, а потом оформить выпуск","возможно использование сценария 1 или 2"],"a":0},

/* ===== КОНЕЦ БАЗЫ ===== */

const $=s=>document.querySelector(s),A=$('#app');
let S={r:{},f:[],att:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('qb1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('qb1',JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ids=s=>QS.map((q,i)=>i).filter(i=>s==null||QS[i].s===s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=l=>l.length?Math.round(l.filter(i=>S.r[i]===1).length/l.length*100):0;
let ses=null,ex=null,tm=null,cur=0,OR={},scr='';
const FIX=/варианты?\s+\d|верны\s+(все|вариант)/i;
function ord(k){if(!OR[k]){const q=QS[k],n=q.o.map((_,i)=>i);OR[k]=q.o.some(t=>FIX.test(t))?n:shuf(n)}return OR[k]}
const go=f=>{clearInterval(tm);scr='';window.scrollTo(0,0);f()};

function home(){ses=ex=null;A.innerHTML=`<h1>Выберите режим</h1>
<button class="card" onclick="go(startExam)">Экзамен<span>›</span></button>
<button class="card" onclick="go(sections)">Учить по разделам<span>›</span></button>
<button class="card" onclick="go(()=>start(shuf(ids()),'mix','Все вопросы'))">Перемешать вопросы<span>›</span></button>
<button class="card" onclick="go(favs)">Избранные<span>›</span></button>
<button class="card" onclick="go(stats)">Статистика<span>›</span></button>
<button class="card" onclick="go(search)">Найти вопрос<span>›</span></button>
<p class="mu s" style="text-align:center">Вопросов в базе: ${QS.length}</p>`}

function modal(t,p){const d=document.createElement('div');d.className='mod';d.innerHTML=`<div class="mb"><h3>${t}</h3><p>${p}</p><button class="btn">OK</button></div>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}

function sections(){A.innerHTML=`<div class="top"><button class="x" onclick="go(home)">✕</button>&nbsp;</div><h1 style="margin-top:0">Выберите раздел</h1>`+SECTIONS.map((n,i)=>{const l=ids(i);return `<button class="card sec ${i==cur?'on':''}" onclick="go(()=>secView(${i}))"><span>${i+1}.${esc(n)}</span><span style="display:flex;gap:10px;align-items:center"><span class="pct">${pc(l)}%</span>›</span></button>`}).join('')}

function secView(i){cur=i;const l=ids(i),ok=l.filter(k=>S.r[k]===1).length;
A.innerHTML=`<div class="top"><button class="x" onclick="go(sections)">✕</button>Всего правильно: ${pc(l)}% (${ok}/${l.length})</div><h1 style="margin:10px 0 16px;font-size:22px">${i+1}.${esc(SECTIONS[i])}</h1>
<button class="btn" style="margin-bottom:14px" onclick="go(()=>start(shuf(ids(${i})),'sec',SECTIONS[${i}],${i}))">🔀 Перемешать вопросы раздела</button>`+
(l.length?l.map((k,n)=>`<button class="card ${S.r[k]===1?'ok':S.r[k]===0?'bad':''}" style="font-weight:500;font-size:16px" onclick="go(()=>start(ids(${i}),'sec',SECTIONS[${i}],${i},${n}))"><span>${QS[k].n||n+1}.${esc(QS[k].q.slice(0,50))}${QS[k].q.length>50?'…':''}</span><span>›</span></button>`).join(''):'<p class="mu">В этом разделе пока нет вопросов</p>')}

function start(list,kind,title,sec,i=0){if(!list.length)return modal('Нет вопросов','В этой подборке пока пусто.');OR={};ses={list,kind,title,sec,i,ok:0,bad:0,pk:{},hint:0};practice()}

function practice(){scr='p';const k=ses.list[ses.i],q=QS[k],p=ses.pk[k],n=ses.list.length;
const head=ses.kind==='sec'||ses.kind==='one'?`${ses.i+1} из ${n}`:`${ses.i+1}/${n} · ✓${ses.ok} · ✕${ses.bad}`;
A.innerHTML=`<div class="top"><button class="x" onclick="closeSes()">✕</button>${head}</div>
<div class="chip"><span>${esc(SECTIONS[q.s])}</span><button class="star ${S.f.includes(k)?'on':''}" onclick="fav(${k})">${S.f.includes(k)?'★':'☆'}</button></div>
<div class="q">${esc(q.q)}</div>
${q.h||q.u?`<div class="row"><button class="btn h" onclick="hint()">Подсказка</button><button class="btn h" onclick="hurl()">Подсказка URL</button></div>`:''}
${ses.hint&&(q.h||q.u)?`<div class="hint">${esc(q.h||'Для этого вопроса подсказки нет')}</div>`:''}
${ord(k).map(j=>`<button class="opt ${p!==undefined?(j===q.a?'ok':j===p?'bad':''):''}" onclick="pick(${j})">${esc(q.o[j])}</button>`).join('')}
<div class="nav"><div class="row" style="margin:0"><button class="btn g" onclick="mv(-1)">‹ Предыдущий</button><button class="btn" onclick="mv(1)">Следующий ›</button></div><div class="kb">Клавиши: 1–9 — ответ, ← → — вопросы, Esc — выход</div></div>`}
function closeSes(){const s=ses.kind==='sec'?ses.sec:null;go(s==null?home:()=>secView(s))}
function mv(d){const n=ses.i+d;if(n<0||n>=ses.list.length)return;ses.i=n;ses.hint=0;window.scrollTo(0,0);practice()}
function pick(j){const k=ses.list[ses.i];if(ses.pk[k]!==undefined)return;ses.pk[k]=j;const ok=j===QS[k].a;S.r[k]=ok?1:0;ok?ses.ok++:ses.bad++;save();practice()}
function hint(){ses.hint=ses.hint?0:1;practice()}
function hurl(){const u=QS[ses.list[ses.i]].u;u?window.open(u,'_blank'):modal('Нет ссылки','Для этого вопроса ссылки нет.')}
function fav(k){const i=S.f.indexOf(k);i<0?S.f.push(k):S.f.splice(i,1);save();ses?practice():0}

function favs(){if(!S.f.length)return modal('Не найдено избранных вопросов.','У Вас пока нет избранных вопросов!'),home();start(S.f.slice(),'fav','Избранные')}

function startExam(){const pool=[];SECTIONS.forEach((_,i)=>{const l=ids(i);if(l.length)pool.push(shuf(l)[0])});
if(!pool.length){modal('Нет вопросов','Сначала добавь вопросы в базу.');return home()}
OR={};ex={ids:pool,i:0,a:{},end:Date.now()+30*60*1000};tm=setInterval(tick,1000);exam()}
const left=()=>Math.max(0,Math.round((ex.end-Date.now())/1000));
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){const e=$('#tm');if(e)e.textContent=fmt(left());if(left()<=0)finish(true)}
function exam(){scr='e';const k=ex.ids[ex.i],q=QS[k];
A.innerHTML=`<div class="top"><button class="x" onclick="if(confirm('Выйти без сохранения результата?'))go(home)">✕</button><span id="tm">${fmt(left())}</span></div>
<h1 style="margin:6px 0 16px;font-size:26px">${ex.i+1}/${ex.ids.length}</h1><div class="q">${esc(q.q)}</div>
${ord(k).map(j=>`<button class="opt ${ex.a[k]===j?'sel':''}" onclick="ex.a[${k}]=${j};exam()">${esc(q.o[j])}</button>`).join('')}
<div class="nav"><div class="row" style="margin:0"><button class="btn g" onclick="exMv(-1)">‹ Предыдущий</button><button class="btn" onclick="exMv(1)">Следующий ›</button></div>
<button class="lnk" onclick="finish()">Завершить экзамен</button><div class="kb">Клавиши: 1–9 — ответ, ← → — вопросы</div></div>`}
function exMv(d){const n=ex.i+d;if(n>=0&&n<ex.ids.length){ex.i=n;window.scrollTo(0,0);exam()}}
function finish(auto){if(!auto&&!confirm('Завершить экзамен?'))return;clearInterval(tm);
const sc=ex.ids.filter(k=>ex.a[k]===QS[k].a).length,t=ex.ids.length;
S.att.push({d:Date.now(),sc,t});save();const e=ex;ex=null;
A.innerHTML=`<div class="top"><button class="x" onclick="go(home)">✕</button>Результат: ${sc} из ${t} (${Math.round(sc/t*100)}%)</div>`+
e.ids.map((k,n)=>{const q=QS[k],ok=e.a[k]===q.a;return `<div class="card ${ok?'ok':'bad'}" style="display:block;font-weight:500;font-size:15px"><b>${n+1}. ${esc(q.q)}</b><div class="s">Твой ответ: ${e.a[k]===undefined?'—':esc(q.o[e.a[k]])}</div>${ok?'':`<div class="s">Верно: ${esc(q.o[q.a])}</div>`}</div>`}).join('')+`<button class="btn" onclick="go(home)">Домой</button>`}

function stats(){const all=ids();
A.innerHTML=`<div class="top"><button class="x" onclick="go(home)">✕</button>Статистика</div>
<div class="chip"><span>Всего выучено</span><span>${pc(all)}% (${all.filter(i=>S.r[i]===1).length}/${all.length})</span></div>`+
SECTIONS.map((n,i)=>`<div class="chip" style="font-weight:500"><span>${i+1}.${esc(n)}</span><span class="pct">${pc(ids(i))}%</span></div>`).join('')+
`<h3>Попытки экзамена</h3>`+(S.att.length?S.att.slice().reverse().map(a=>`<div class="chip" style="font-weight:500"><span>${new Date(a.d).toLocaleString('ru-RU')}</span><span>${a.sc}/${a.t}</span></div>`).join(''):'<p class="mu">По этому тренажёру ещё не было попыток сдачи экзамена!</p>')+
`<button class="btn g" onclick="if(confirm('Сбросить весь прогресс?')){S={r:{},f:[],att:[]};save();stats()}">Сбросить прогресс</button>`}

function search(){A.innerHTML=`<div class="top"><button class="x" onclick="go(home)">✕</button>Поиск вопроса</div><input id="si" placeholder="Введите часть вопроса" autofocus><div id="sr"></div>`;
$('#si').oninput=e=>{const v=e.target.value.trim().toLowerCase();$('#sr').innerHTML=v?ids().filter(i=>QS[i].q.toLowerCase().includes(v)).slice(0,50).map(i=>`<button class="card" style="font-weight:500;font-size:16px" onclick="go(()=>start([${i}],'one'))"><span>${esc(QS[i].q)}</span><span>›</span></button>`).join(''):''}}
document.addEventListener('keydown',e=>{
if(e.ctrlKey||e.metaKey||e.altKey||document.querySelector('.mod')||/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
if(scr==='p'&&ses){const k=ses.list[ses.i];
if(/^[1-9]$/.test(e.key)){const j=ord(k)[+e.key-1];if(j!==undefined)pick(j)}
else if(e.key==='ArrowRight'||(e.key==='Enter'&&e.target.tagName!=='BUTTON'))mv(1);else if(e.key==='ArrowLeft')mv(-1);else if(e.key==='Escape')closeSes()}
else if(scr==='e'&&ex){const k=ex.ids[ex.i];
if(/^[1-9]$/.test(e.key)){const j=ord(k)[+e.key-1];if(j!==undefined){ex.a[k]=j;exam()}}
else if(e.key==='ArrowRight')exMv(1);else if(e.key==='ArrowLeft')exMv(-1)}});
home();
</script>
</body>
</html>
